<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset=".55" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".5" cy=".32" r=".55">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ff9f1c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" rx="0" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#orb)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <!-- decorative rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2">
    <circle cx="300" cy="260" r="120"/>
    <circle cx="300" cy="260" r="165"/>
    <circle cx="300" cy="260" r="210"/>
  </g>
  <g transform="translate(300,260)" text-anchor="middle">
    <text font-family="system-ui,Segoe UI,Roboto,Arial" font-size="92" font-weight="900" fill="#fff">🐲</text>
  </g>
  <!-- badge -->
  <g transform="translate(36,36)">
    <rect width="170" height="44" rx="22" fill="#000" fill-opacity=".65"/>
    <text x="85" y="29" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial" font-size="20" font-weight="800" fill="#fff">DONGHUA • 2024</text>
  </g>
  <g transform="translate(464,36)">
    <rect width="100" height="44" rx="22" fill="#ffd166"/>
    <text x="50" y="29" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial" font-size="20" font-weight="900" fill="#111">★ 7.5</text>
  </g>
  <!-- title -->
  <g text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial">
    <text x="300" y="500" font-size="30" font-weight="800" fill="#fff" opacity=".95" letter-spacing="3">YAO SHEN JI</text>
    <text x="300" y="548" font-size="46" font-weight="900" fill="#fff">Tales of Demons</text>
    <text x="300" y="598" font-size="46" font-weight="900" fill="#fff">and Gods</text>
    <text x="300" y="648" font-size="32" font-weight="900" fill="#ffd166">SEASON 7 • 26 EP</text>
    <text x="300" y="682" font-size="18" font-weight="600" fill="#fff" opacity=".9">Action • Fantasy • Adventure</text>
  </g>
  <rect y="730" width="600" height="70" fill="#000" fill-opacity=".45"/>
  <text x="300" y="773" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial" font-size="20" font-weight="700" fill="#fff">Nie Li kembali • Glory City • Legal embed</text>
</svg>
